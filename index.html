<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Was It Interesting? - F1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-p-6">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-4">Was It Interesting? 🏎️</h1>
        
        <!-- Dropdown for Races -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Select Grand Prix:</label>
            <select id="raceSelect" class="bg-slate-800 border border-slate-700 rounded p-2 text-white w-full">
                <option>Loading races from database...</option>
            </select>
        </div>

        <!-- Display Box -->
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
            <h2 id="raceTitle" class="text-xl font-semibold mb-2">Select a race</h2>
            <p class="text-lg">WII Score: <span id="wiiScoreDisplay" class="font-bold text-green-400">-</span></p>
            <p class="text-md">Recommendation: <span id="recommendationDisplay" class="font-semibold text-amber-400">-</span></p>
        </div>
    </div>

    <script>
        // Initialize Supabase safely
        const SUPABASE_URL = 'https://ultrinfqyvqbiifzumem.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zTNiZYTDu-M18dMO6ZC3tQ_pLjxomqW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let racesData = [];

        async function loadRacesFromSupabase() {
            const { data, error } = await supabase.from('races').select('*');
            if (error) {
                console.error('Error fetching data:', error);
                return;
            }
            racesData = data;
            console.log("Fetched races successfully:", racesData);
            
            if (racesData.length > 0) {
                populateUI(racesData);
            }
        }

        function populateUI(races) {
            const selectEl = document.getElementById('raceSelect');
            selectEl.innerHTML = '';
            
            races.forEach(race => {
                const opt = document.createElement('option');
                opt.value = race.id;
                opt.textContent = race.title;
                selectEl.appendChild(opt);
            });

            // Show first race details by default
            displayRace(races[0]);

            // Listen for changes
            selectEl.addEventListener('change', (e) => {
                const selected = races.find(r => r.id === e.target.value);
                if (selected) displayRace(selected);
            });
        }

        function displayRace(race) {
            document.getElementById('raceTitle').textContent = race.title;
            document.getElementById('wiiScoreDisplay').textContent = race.wii_score;
            document.getElementById('recommendationDisplay').textContent = race.recommendation;
        }

        window.addEventListener('DOMContentLoaded', loadRacesFromSupabase);
    </script>
</body>
</html>
